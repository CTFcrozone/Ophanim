[workspace]
members = ["crates/libs/lib-quic", "crates/apps/ophanim-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"
# unused = { level = "allow", priority = -1 } # For exploratory dev.

[workspace.dependencies]
derive_more = {version = "2", features = ["from", "display"] }
clap = { version = "4.5.20",  features = ["std", "cargo", "derive"] }
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1"}
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pcap = "2.5.0"
hex = "0.4.3"
